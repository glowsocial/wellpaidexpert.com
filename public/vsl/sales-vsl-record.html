<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sales VSL — Recorder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      gap: 16px;
    }
    canvas { border: 1px solid #333; display: block; }
    #status {
      color: #c8b89a;
      font-size: 14px;
      letter-spacing: 1px;
      min-height: 20px;
    }
    #btn {
      background: #7c2d3e;
      color: #fff;
      border: none;
      padding: 14px 40px;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 1px;
    }
    #btn:disabled { opacity: 0.4; cursor: default; }
    #btn:hover:not(:disabled) { background: #9a3a4e; }
  </style>
</head>
<body>
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="status">Ready — click Record to begin</div>
  <button id="btn">⏺ Record Video</button>

<script>
// ── Slide data ──────────────────────────────────────────────────────────────
const SLIDES = [
  {
    bg: '#0e0e12',
    eyebrow: 'MOST SMMA COURSES TEACH YOU THIS',
    headline: 'How to create content.',
    headlineEm: 'create content.',   // portion to render in gold
    body: 'Design graphics. Write captions. Come up with ideas. Every single week.',
  },
  {
    bg: '#7c2d3e',
    headline: "That's not an agency.",
    body: "That's a full-time job with demanding bosses\nwho pay you by the hour.",
  },
  {
    bg: '#0e0e12',
    eyebrow: "THERE'S A BETTER MODEL",
    headline: 'What if you ran the business —\nand automated the rest?',
    headlineEm: 'business —',
  },
  {
    bg: '#1a1a2e',
    stat: '6',
    statLabel: 'ACTIVE CLIENTS',
    body: '15 minutes per client, per week.\nNot 15 hours. 15 minutes.',
  },
  {
    bg: '#0e0e12',
    eyebrow: 'THE FULFILLMENT ENGINE',
    headline: 'AI handles the content.\nYou handle the clients.',
    headlineEm: 'clients.',
  },
  {
    bg: '#f5f0e8',
    eyebrow: 'THE AGENCY BLUEPRINT — WHAT\'S INSIDE',
    bullets: [
      'Niche selection — 5 industries that pay the most and churn the least',
      '9 copy-paste cold outreach scripts for LinkedIn and email',
      'The 60-Second Close — generate a sample feed for any prospect on the spot',
      'AI Proposal Generator — professional proposal in under a minute',
      'Pricing strategy and anchoring guide',
      'The fulfillment engine — run 6+ clients without a team',
    ],
  },
  {
    bg: '#0e0e12',
    eyebrow: 'THE MATH',
    headline: '$750/mo × 6 clients\n= $4,300/mo profit.',
    headlineEm: '$4,300/mo profit.',
    body: 'No employees. No office. No Canva.',
  },
  {
    bg: '#7c2d3e',
    eyebrow: 'WHAT IT COSTS',
    price: '$27',
    priceNote: 'ONE-TIME · INSTANT ACCESS',
    body: 'No subscription. No upsell to "the real training." This is it.',
  },
  {
    bg: '#0e0e12',
    eyebrow: 'THE WELL-PAID EXPERT',
    headline: "The most useful $27\nyou'll spend on this.",
    headlineEm: '$27',
    body: 'The checkout is right here. Let\'s go.',
  },
];

// Slide start times from ElevenLabs (seconds)
const CUES = [0, 12.342, 18.251, 34.076, 54.150, 58.167, 95.957, 113.860, 134.026];
const TOTAL = 134.769;
const AUDIO_SRC = 'sales-vsl.mp3';

// ── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 1280, H = 720;

// ── Font loading ─────────────────────────────────────────────────────────────
async function loadFonts() {
  const playfair = new FontFace('Playfair Display', "url('https://fonts.gstatic.com/s/playfairdisplay/v37/nuFvD-vYSZviVYUb_rj3ij__anPXJzDwcbmjWBN2PKd3vUDQ.woff2')");
  const inter    = new FontFace('Inter',            "url('https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2')");
  await Promise.all([playfair.load(), inter.load()]);
  document.fonts.add(playfair);
  document.fonts.add(inter);
}

// ── Drawing helpers ──────────────────────────────────────────────────────────
const CREAM  = '#f5f0e8';
const GOLD   = '#c8b89a';
const MAROON = '#7c2d3e';
const NAVY   = '#1a1a2e';
const WHITE  = '#ffffff';

function fillBg(color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, W, H);
}

function drawBadge(y) {
  // watermark
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.font = '11px Inter';
  ctx.textAlign = 'right';
  ctx.fillText('THE WELL-PAID EXPERT', W - 32, H - 22);
}

function drawDivider(y, color = MAROON) {
  ctx.fillStyle = color;
  ctx.fillRect(W/2 - 24, y, 48, 3);
  return y + 3;
}

function wrapText(text, x, y, maxWidth, lineHeight) {
  const lines = text.split('\n');
  let curY = y;
  for (const line of lines) {
    const words = line.split(' ');
    let current = '';
    for (const word of words) {
      const test = current ? current + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && current) {
        ctx.fillText(current, x, curY);
        current = word;
        curY += lineHeight;
      } else {
        current = test;
      }
    }
    ctx.fillText(current, x, curY);
    curY += lineHeight;
  }
  return curY;
}

function drawSlide(slide) {
  fillBg(slide.bg);
  const isDark = slide.bg !== CREAM;
  const textColor = isDark ? WHITE : NAVY;
  const bodyColor = isDark ? 'rgba(255,255,255,0.78)' : '#4b5563';
  const eyebrowColor = isDark ? GOLD : '#8b7355';

  let y = H / 2;
  ctx.textAlign = 'center';

  // ── Price slide ──────────────────────────────────────────────────────────
  if (slide.price) {
    let top = 160;
    if (slide.eyebrow) {
      ctx.fillStyle = eyebrowColor;
      ctx.font = '700 12px Inter';
      ctx.letterSpacing = '4px';
      ctx.fillText(slide.eyebrow, W/2, top); top += 48;
    }
    ctx.fillStyle = WHITE;
    ctx.font = '700 140px "Playfair Display"';
    ctx.fillText(slide.price, W/2, top + 130); top += 200;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '600 13px Inter';
    ctx.fillText(slide.priceNote, W/2, top); top += 40;
    drawDivider(top + 10, 'rgba(255,255,255,0.3)');
    top += 40;
    ctx.fillStyle = bodyColor;
    ctx.font = '400 22px Inter';
    wrapText(slide.body, W/2, top + 24, 720, 36);
    drawBadge();
    return;
  }

  // ── Stat slide ───────────────────────────────────────────────────────────
  if (slide.stat) {
    ctx.fillStyle = GOLD;
    ctx.font = '700 160px "Playfair Display"';
    ctx.fillText(slide.stat, W/2, H/2 - 60);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '600 12px Inter';
    ctx.fillText(slide.statLabel, W/2, H/2 + 10);
    drawDivider(H/2 + 40, GOLD);
    ctx.fillStyle = bodyColor;
    ctx.font = '400 26px Inter';
    wrapText(slide.body, W/2, H/2 + 100, 700, 42);
    drawBadge();
    return;
  }

  // ── Bullet slide ─────────────────────────────────────────────────────────
  if (slide.bullets) {
    let top = 100;
    if (slide.eyebrow) {
      ctx.fillStyle = eyebrowColor;
      ctx.font = '700 11px Inter';
      ctx.fillText(slide.eyebrow, W/2, top); top += 44;
    }
    ctx.textAlign = 'left';
    const lx = W/2 - 320;
    for (const b of slide.bullets) {
      // checkmark
      ctx.fillStyle = GOLD;
      ctx.font = '700 20px Inter';
      ctx.fillText('✓', lx, top);
      // text
      ctx.fillStyle = NAVY;
      ctx.font = '400 20px Inter';
      ctx.fillText(b, lx + 30, top);
      top += 72;
    }
    ctx.textAlign = 'center';
    drawBadge();
    return;
  }

  // ── Standard slide ───────────────────────────────────────────────────────
  // Calculate total height to center block
  let blockH = 0;
  if (slide.eyebrow)  blockH += 32 + 28;        // eyebrow + gap
  if (slide.headline) {
    const lines = slide.headline.split('\n').length;
    blockH += lines * 86 + 28;                   // headline lines + gap
  }
  blockH += 3 + 28 + 28;                         // divider + gap + body approx
  if (slide.body) {
    const lines = slide.body.split('\n').length;
    blockH += lines * 36;
  }

  let cy = (H - blockH) / 2;

  if (slide.eyebrow) {
    ctx.fillStyle = eyebrowColor;
    ctx.font = '700 12px Inter';
    ctx.fillText(slide.eyebrow, W/2, cy); cy += 48;
  }

  if (slide.headline) {
    const parts = slide.headline.split('\n');
    ctx.font = '700 72px "Playfair Display"';
    for (let i = 0; i < parts.length; i++) {
      const line = parts[i];
      if (slide.headlineEm && line.includes(slide.headlineEm)) {
        // draw regular part then em part
        const emIdx = line.indexOf(slide.headlineEm);
        const before = line.slice(0, emIdx);
        const em     = slide.headlineEm;
        const after  = line.slice(emIdx + em.length);
        const totalW = ctx.measureText(line).width;
        let lx = W/2 - totalW/2;
        ctx.fillStyle = textColor;
        ctx.textAlign = 'left';
        ctx.fillText(before, lx, cy);
        lx += ctx.measureText(before).width;
        ctx.fillStyle = GOLD;
        ctx.font = '700 italic 72px "Playfair Display"';
        ctx.fillText(em, lx, cy);
        lx += ctx.measureText(em).width;
        ctx.fillStyle = textColor;
        ctx.font = '700 72px "Playfair Display"';
        ctx.fillText(after, lx, cy);
        ctx.textAlign = 'center';
      } else {
        ctx.fillStyle = textColor;
        ctx.fillText(line, W/2, cy);
      }
      cy += 86;
    }
    cy += 8;
  }

  drawDivider(cy, isDark ? MAROON : MAROON);
  cy += 3 + 32;

  if (slide.body) {
    ctx.fillStyle = bodyColor;
    ctx.font = '400 26px Inter';
    wrapText(slide.body, W/2, cy, 760, 40);
  }

  drawBadge();
}

// ── Slide index from time ────────────────────────────────────────────────────
function slideAt(t) {
  let idx = 0;
  for (let i = 0; i < CUES.length; i++) {
    if (t >= CUES[i]) idx = i;
  }
  return idx;
}

// ── Main record flow ─────────────────────────────────────────────────────────
const btn    = document.getElementById('btn');
const status = document.getElementById('status');

btn.addEventListener('click', async () => {
  btn.disabled = true;
  status.textContent = 'Loading fonts & audio...';

  await loadFonts();

  // Load audio via AudioContext (needed for MediaStream)
  const audioCtx = new AudioContext({ sampleRate: 44100 });
  const resp = await fetch(AUDIO_SRC);
  const buf  = await audioCtx.decodeAudioData(await resp.arrayBuffer());

  // Canvas stream (30 fps)
  const videoStream = canvas.captureStream(30);

  // Audio stream
  const audioDest   = audioCtx.createMediaStreamDestination();
  const audioSource = audioCtx.createBufferSource();
  audioSource.buffer = buf;
  audioSource.connect(audioDest);
  audioSource.connect(audioCtx.destination); // monitor in speakers too

  // Combine
  const combined = new MediaStream([
    ...videoStream.getVideoTracks(),
    ...audioDest.stream.getAudioTracks(),
  ]);

  // MediaRecorder
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
    ? 'video/webm;codecs=vp9,opus'
    : 'video/webm';
  const recorder = new MediaRecorder(combined, { mimeType, videoBitsPerSecond: 4_000_000 });
  const chunks   = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'wpe-sales-vsl.webm';
    a.click();
    status.textContent = '✓ Download started! Convert with: ffmpeg -i wpe-sales-vsl.webm -c:v libx264 -c:a aac wpe-sales-vsl.mp4';
    btn.disabled = false;
    btn.textContent = '⏺ Record Again';
  };

  // Animate canvas driven by audio time
  const startTime = audioCtx.currentTime;
  let   lastSlide = -1;

  function render() {
    const elapsed = audioCtx.currentTime - startTime;
    const sIdx    = slideAt(elapsed);
    if (sIdx !== lastSlide) {
      drawSlide(SLIDES[sIdx]);
      lastSlide = sIdx;
    }
    if (elapsed < TOTAL + 0.5) {
      requestAnimationFrame(render);
    }
  }

  // Draw first slide before starting
  drawSlide(SLIDES[0]);

  recorder.start(100);
  audioSource.start();
  requestAnimationFrame(render);

  status.textContent = '⏺ Recording... (134s)';

  // Stop when audio ends + 0.5s buffer
  audioSource.onended = () => {
    setTimeout(() => { recorder.stop(); }, 500);
  };
});
</script>
</body>
</html>
